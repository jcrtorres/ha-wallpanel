name: HA Wallpanel
version: "0.1.0"
slug: wallpanel
description: Panel de pared minimalista y editable para tablets, con vistas deslizables.
url: https://github.com/jcrtorres/ha-wallpanel
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:tablet-dashboard
panel_title: Panel de pared
# false = el panel aparece también para usuarios no administradores (p. ej. el usuario de la tablet)
panel_admin: false
homeassistant_api: true
# Puerto directo para modo kiosko, desactivado por defecto (ver DOCS.md antes de activarlo).
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Acceso directo sin ingress (sin autenticación, solo en redes de confianza)
options: {}
schema: {}
